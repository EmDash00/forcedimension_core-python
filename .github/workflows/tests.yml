name: tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.9.26"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python: ["pypy3.10", "pypy3.11", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies with uv
        run: uv sync --group test

      - name: Lint and Check Style
        run: uv run flake8 forcedimension_core --ignore "F401,E501,E704"

      - name: Run tests and generate coverage
        run: |
          uv run coverage run -m unittest tests
          uv run coverage report

      - name: Upload coverage data to coveralls.io
        run: uv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.python }}
          COVERALLS_PARALLEL: true

  coveralls:
    name: Indicate completion to coveralls.io
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      - name: Install Python dependencies with uv
        run: uv sync --group test

      - name: Send final coverage data to coveralls.io
        run: uv run coveralls --service=github --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
