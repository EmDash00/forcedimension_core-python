[project]
name = "forcedimension-core"
version = "1.1.0-dev"
description = "Unofficial Python Bindings for the Force Dimension SDK"
authors = [{ name = "Ember Chow", email = "emberchow.business@gmail.com" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "LGPL-3.0"
keywords = [
    "forcedimension",
    "haptics",
    "bindings",
]
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Human Interface Device (HID)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2,<3",
    "typing-extensions>=4.6.0,<5",
]

[project.optional-dependencies]
numpy = ["numpy"]

[project.urls]
Repository = "https://github.com/EmDash00/forcedimension_core-python"
Documentation = "https://forcedimension-core-python-docs.readthedocs.io/en/v1.0.0/"
Changelog = "https://github.com/EmDash00/forcedimension_core-python/blob/main/CHANGELOG.md"

[dependency-groups]
docs = [
    "sphinx>=6.2.1,<7",
    "sphinx-rtd-theme>=1.3.0,<2",
]
test = [
    "coveralls~=3.3.1",
    "coverage[toml]",
    "flake8>=5.0.0,<6 ; python_full_version < '3.8.1'",
    "flake8>=6.0.0,<7 ; python_full_version >= '3.8.1'",
]

[tool.coverage.run]
branch = true
omit = [
  "tests",
]

[tool.coverage.report]
omit = [
  "tests/*",
  "forcedimension_core/typing.py"
]
exclude_lines = [ "\\.\\.\\." ]
